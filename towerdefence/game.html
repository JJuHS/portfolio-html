<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defence Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tower Defence</h1>
    <div id="game-play-container">
        <div id="game-info">
            <div id="game-status-info">
                <p id="current-level">Level: 1</p>
                <p id="enemies-remaining">enemy : 0/20</p>
                <p id="life-remaining">life : 5/5</p>
                <p id="game-time">00:00</p>
                <p id="gold-earned">Gold: 0</p>
                <p id="coins-earned">Coins: 0</p>
            </div>
            <div id="controls">
                <button id="pause-btn" class="game-button">Pause</button>
                <button id="restart-btn" class="game-button">Restart</button>
                <button id="quit-btn" class="game-button" onclick="quitGame()">Quit</button>
                <button id="speed-btn" class="game-button">2x Speed</button>
            </div>
        </div>
        <div id="tower-select">
            <button onclick="selectTowerAttribute('water')">💧Water</button>
            <button onclick="selectTowerAttribute('fire')">🔥Fire</button>
            <button onclick="selectTowerAttribute('wind')">🍃Wind</button>
        </div>
        <div id="upgrade-menu"></div>
        <canvas id="gameCanvas"width="800" height="237.5"></canvas>
    </div>
        <h3>게임 설명</h3>
    </div>
    <script src="src/game.js"></script>
</body>
</html>
